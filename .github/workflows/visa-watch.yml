name: Visa watch

on:
  schedule:
    - cron: '43 7 * * *'   # every day, 07:43 UTC (each source page gets checked once a week)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: visa-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check official pages against the visa guides
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/visa-watch.mjs

      - name: Cross-check passport data with the weekly dataset
        continue-on-error: true
        run: node scripts/passport-check.mjs

      - name: Save page fingerprints and reports
        run: |
          git config user.name "escape-plan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state VISA-CHECK.md PASSPORT-CHECK.md
          git diff --cached --quiet && exit 0
          git commit -m "Visa watch $(date -u +%F) [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
